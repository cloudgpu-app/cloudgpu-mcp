[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "cloudgpu"
version = "0.1.0"
description = "Owner-approved compute scheduling client for CloudGPU agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
[project.scripts]
cloudgpu = "cloudgpu.__main__:main"
[project.urls]
Homepage = "https://cloudgpu.app/docs/mcp"
Repository = "https://github.com/cloudgpu-app/cloudgpu-mcp"
[tool.setuptools]
packages = ["cloudgpu"]
