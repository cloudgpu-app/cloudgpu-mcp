name: Optional Python framework acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CREWAI_TELEMETRY_OPT_OUT: 'true'
      OTEL_SDK_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r python/requirements-framework-acceptance.txt
      - run: python -m pip check
      - run: PYTHONPATH=python python -m unittest discover -s python/tests
      - name: Actual framework schemas, execution, spending guard and anonymous HTTP
        run: python python/integration/framework_acceptance.py
