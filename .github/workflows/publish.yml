name: Publish to npm

on:
  push:
    tags:
      - "v*"
    # 2026-11-03：合并进 main 且 package.json 里的版本号变了就自动发（会话推不了 tag、也点不了 Run workflow）。
    # 下面会先查 npm 上有没有这个版本，有就整条跳过，所以别的改动合进 main 不会重复发。
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/publish.yml
  # manual run: publishes the version in package.json from the chosen branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance and MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Check whether this version is already on npm
        id: npmcheck
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "cloudgpu-mcp@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npmcheck.outputs.published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm version to be visible
        if: steps.npmcheck.outputs.published != 'true'
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            npm view "cloudgpu-mcp@$V" version >/dev/null 2>&1 && exit 0
            echo "waiting for cloudgpu-mcp@$V ($i/30)"; sleep 10
          done
          echo "npm version not visible" >&2; exit 1

      # 已存在的不可变版本先核对，避免重跑时误报“重复版本”。
      - name: Check existing MCP Registry publication
        id: registrycheck
        run: node scripts/registry-publication.mjs
      - name: Publish to MCP Registry
        if: steps.registrycheck.outputs.published != 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" -o publisher.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt $i failed, retrying"; sleep 15
          done
          exit 1

      - name: Verify public Registry version and latest alias
        run: node scripts/registry-publication.mjs --required
