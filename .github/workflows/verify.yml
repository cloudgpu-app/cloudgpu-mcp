name: Verify MCP package
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Python SDK without network or paid work
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests
      - run: node --check scripts/d13-joint-acceptance.mjs
      - name: Verify release manifest consistency and packaged files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const version=read('package.json').version;
          assert.equal(read('package-lock.json').version,version);
          assert.equal(read('package-lock.json').packages[''].version,version);
          assert.equal(read('server.json').version,version);
          assert.equal(read('server.json').packages[0].version,version);
          assert.ok(fs.readFileSync('src/index.js','utf8').includes(`const VERSION = "${version}"`));
          JS
          npm pack --dry-run
  image-smoke:
    name: Docker image stdio smoke (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check exact npm release availability
        id: npm_release
        run: node scripts/npm-release-availability.mjs
      - name: Build this PR Dockerfile and compare against published npm
        if: steps.npm_release.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(mktemp -d)
          trap 'rm -rf "$baseline"' EXIT
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          npm install --prefix "$baseline" --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org "cloudgpu-mcp@$version"
          docker build --pull -t cloudgpu-image-smoke .
          timeout --signal=TERM --kill-after=10s 120s \
            node scripts/docker-smoke.mjs cloudgpu-image-smoke "$baseline"
