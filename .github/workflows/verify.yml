name: Verify MCP package
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Python SDK without network or paid work
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests
      - run: node --check scripts/d13-joint-acceptance.mjs
      - name: Verify release manifest consistency and packaged files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const version=read('package.json').version;
          assert.equal(read('package-lock.json').version,version);
          assert.equal(read('package-lock.json').packages[''].version,version);
          assert.equal(read('server.json').version,version);
          assert.equal(read('server.json').packages[0].version,version);
          assert.ok(fs.readFileSync('src/index.js','utf8').includes(`const VERSION = "${version}"`));
          JS
          npm pack --dry-run
