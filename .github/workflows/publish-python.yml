name: Publish CloudGPU Python SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed Python package version
        required: true
        default: '0.1.0'
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact release and private client behavior
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os,tomllib; assert tomllib.load(open("python/pyproject.toml","rb"))["project"]["version"]==os.environ["RELEASE_VERSION"]'
          PYTHONPATH=python python -m unittest discover -s python/tests
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.3.0
          python -m build python --outdir python/dist
      - name: Publish through configured PyPI trusted identity
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python/dist/
